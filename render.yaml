# Render Blueprint: one web service and one PostgreSQL database, both on the free plan.
# Render > New > Blueprint > this repository, branch main. PARTNER_KEYS (sync: false) is typed into
# Render's dashboard when the Blueprint is created; Render asks only then, and secrets are never kept in git.
# Ujuzi's URL and key are not declared here on purpose: add UJUZI_API_URL and UJUZI_API_KEY in the
# service's Environment tab when Ujuzi is live. Steps and checks: README, "Run on Render".
databases:
  - name: sherehe-db
    plan: free
    region: frankfurt
    databaseName: sherehe
    user: sherehe

services:
  - type: web
    name: sherehe
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    # Render sets NODE_ENV=production, which makes a plain `npm install` skip devDependencies. The build
    # needs typescript, tailwindcss and @tailwindcss/postcss, and `npm start` runs tsx, so they stay.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Render's own default is Node 24, close to the Node this was built and tested on.
      - key: NODE_VERSION
        value: "24"
      # The database's internal connection string (same region, no SSL needed).
      - key: DATABASE_URL
        fromDatabase:
          name: sherehe-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Behind Render's proxy: tell callers apart by their real address for the rate limit.
      - key: TRUST_PROXY
        value: "true"
      - key: BOOKING_POLL_MS
        value: "300000"
      # name:SHA-256-hash of each key we issue, e.g. kazi:<hash> (npm run partner:key -- --name kazi).
      # With nothing here every partner call is refused (401).
      - key: PARTNER_KEYS
        sync: false
